services:
  server-mono:
    profiles: ["mono"]
    build:
      context: ./server
      dockerfile: Dockerfile.mono
    platform: ${SERVER_MONO_PLATFORM:-linux/amd64}
    container_name: zentry-mono-server
    image: aashishpal09/zentry-mono-server:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PUBLIC_PORT=3000
      - APP_PORT=3001
      - WORKER_TYPE=video-processor
      - REDIS_HOST=127.0.0.1
      - REDIS_PORT=6379
      - REDIS_TLS=false
      - REDIS_COMMANDER_PORT=8081
    env_file:
      - ./server/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bhandara-network
    volumes:
      - video-temp:/app/tmp

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: aashishpal09/bhandara-server:latest
    platform: linux/amd64
    container_name: bhandara-server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - ./server/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bhandara-network

  video-worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: bhandara-server
    platform: linux/amd64
    container_name: bhandara-video-worker
    environment:
      - NODE_ENV=production
      - WORKER_TYPE=video-processor
    env_file:
      - ./server/.env
    restart: unless-stopped
    command: ["node", "workers/index.js"]
    networks:
      - bhandara-network
    volumes:
      - video-temp:/app/tmp
    depends_on:
      - server

networks:
  bhandara-network:
    driver: bridge

volumes:
  video-temp:
