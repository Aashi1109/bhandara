services:
  clickstack:
    image: clickhouse/clickstack-all-in-one:latest
    command: clickstack
    ports:
      - "8080:8080"   # HyperDX UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8123:8123"   # ClickHouse HTTP
    volumes:
      - ./data/clickstack/db:/data/db
      - ./data/clickstack/ch:/var/lib/clickhouse
      - ./data/clickstack/logs:/var/log/clickhouse-server
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
